<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#d6e0e8;overflow:hidden;font:14px sans-serif}#status{position:fixed;top:4px;left:12px;z-index:2;color:#111}</style></head><body><div id="status">Chargement personnages 3D réalistes...</div><script type="module">
import * as THREE from 'three';
import {createRealisticWalker,selectRealisticAvatar} from '../src/realisticHumanoids.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#c7d2de');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(960,900);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9f1ff,0x5c6779,2.5));
const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-4,9,8);scene.add(sun);
const camera=new THREE.OrthographicCamera(-4.8,4.8,4.5,-4.5,.05,100);camera.position.set(0,3.4,13);camera.lookAt(0,2,0);
const people=[],errors=[];
for(let i=0;i<12;i++){
 try{
  const person=await createRealisticWalker(i);person.model.position.x+=((i%4)-1.5)*2.2;person.model.position.y+=2.7-Math.floor(i/4)*2.45;
  scene.add(person.model);people.push(person);
 }catch(e){errors.push(String(e.message));console.error(e);}
}
const status={count:people.length,errors,ids:people.map(a=>a.id),duration:people.map(a=>a.duration),skinned:people.map(a=>{let n=0;a.model.traverse(o=>{if(o.isSkinnedMesh)n++});return n})};
window.qaRealistic=status;
document.getElementById('status').textContent='12 costumes réels ; clips Walk. '+JSON.stringify(status);
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;for(const p of people)p.mixer.update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
